name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Install test tools
        # Pinned: ruff has no config here, so its *default* rule set is the lint
        # policy. An unpinned install picked up ruff 0.16 (wider defaults) and
        # turned main red with no code change. Bump deliberately.
        run: pip install pytest "ruff==0.16.9"

      - name: Run tests
        run: pytest -v

      - name: Lint
        run: ruff check .
